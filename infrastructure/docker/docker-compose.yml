# 개발용 데이터 인프라 — 아키텍처 §20의 infrastructure/docker
#
# 이 저장소 전용 컨테이너다. 이름과 포트를 프로젝트로 한정해 다른 프로젝트가
# 쓰는 PostgreSQL과 섞이지 않게 한다.
#
# 이미지는 pgvector를 포함한 것을 쓴다. §11의 검색이 Full Text Search와
# Vector Search를 같은 데이터베이스에서 하도록 설계돼 있어, 나중에 이미지를
# 갈아끼우지 않으려면 처음부터 이쪽이 낫다.

name: ai-study-board

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: ai_study_board
    ports:
      # 7171 블록에 붙여 둔다. 5432는 다른 프로젝트가 쓰고 있다.
      - "7174:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d ai_study_board"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
